<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sixmart Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ef; --stage-a:#ecebe8; --stage-b:#d9d6d1; --panel:#ffffff; --ink:#1b1a19; --muted:#6b6660;
  --line:#e2ddd6; --accent:#d4142a; --accent-ink:#ffffff; --chip:#f2efea; --btn:#ffffffee;
  --tag-spec:#1f6f43; --tag-photo:#1d4f91; --tag-ref:#8a5a00; --tag-inf:#7a3a8f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --stage-a:#1d1d21; --stage-b:#0f0f11; --panel:#1b1b1f; --ink:#ecebe8; --muted:#9b978f;
    --line:#2e2e34; --accent:#ff4b5c; --accent-ink:#1b0306; --chip:#26262c; --btn:#26262cee;
    --tag-spec:#6fd39b; --tag-photo:#8ab8ff; --tag-ref:#f0c060; --tag-inf:#d79cf0;
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --stage-a:#1d1d21; --stage-b:#0f0f11; --panel:#1b1b1f; --ink:#ecebe8; --muted:#9b978f;
  --line:#2e2e34; --accent:#ff4b5c; --accent-ink:#1b0306; --chip:#26262c; --btn:#26262cee;
  --tag-spec:#6fd39b; --tag-photo:#8ab8ff; --tag-ref:#f0c060; --tag-inf:#d79cf0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;height:100vh}
.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--stage-a),var(--stage-b));touch-action:none;user-select:none;-webkit-user-select:none}
#guitar{width:100%;height:100%;display:block;cursor:grab}
#guitar.dragging{cursor:grabbing}
.part{cursor:pointer}
.toolbar{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.toolbar button,.crumb button{border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
.toolbar button:hover{border-color:var(--accent)}
.zoomlvl{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--muted);text-align:center;padding-top:2px}
.crumb{position:absolute;left:14px;top:14px;z-index:2;display:flex;gap:8px;align-items:center}
.crumb .title{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;backdrop-filter:blur(6px)}
.hint{position:absolute;left:14px;bottom:12px;color:var(--muted);font-size:12px;z-index:2;background:var(--btn);border:1px solid var(--line);padding:6px 10px;border-radius:8px;backdrop-filter:blur(6px)}
.tip{position:fixed;pointer-events:none;background:#111;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap}
.panel{min-width:0;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:22px 22px 40px}
.panel h1{font-size:20px;margin:0 0 2px}
.panel h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 12px}
.what{margin:8px 0 0}
table.kv{width:100%;border-collapse:collapse}
table.kv td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--muted);width:38%;padding-right:10px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:999px;margin-left:6px;border:1px solid currentColor;vertical-align:1px;opacity:.85}
.tag.spec{color:var(--tag-spec)} .tag.photo{color:var(--tag-photo)} .tag.ref{color:var(--tag-ref)} .tag.inferred{color:var(--tag-inf)}
.note{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.list{display:flex;flex-direction:column;gap:2px}
.group-label{font-size:11px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.ctl{margin:12px 0}
.ctl label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.ctl label span{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent)}
.sound{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px}
.sound b{display:block;margin-bottom:2px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font:inherit;margin-bottom:10px}
.foot{color:var(--muted);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
.foot a{color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
@media (max-width:860px){
  body{overflow:auto;height:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:64vh auto;height:auto}
  .panel{border-left:0;border-top:1px solid var(--line);padding:16px 16px 40px}
  .hint{display:none}
}
</style>
</head>

<div class="app">

        </linearGradient>
        <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fafafa"/><stop offset=".5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#e6e8ea"/>
        </linearGradient>
        <radialGradient id="knobGrad" cx=".35" cy=".3" r=".8">

        </radialGradient>
        <radialGradient id="ledOn" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#ff5a6a"/><stop offset="1" stop-color="#ff2040" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="puGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a40"/><stop offset=".25" stop-color="#232327"/><stop offset="1" stop-color="#141416"/></linearGradient>
        <radialGradient id="contour"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
        <clipPath id="bodyClip"><path id="bodyClipPath"/></clipPath>
      </defs>
      <g id="world"></g>
      <rect id="hoverBox" fill="none" stroke="var(--accent)" stroke-opacity=".5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" stroke-width="1.5" rx="3" visibility="hidden" pointer-events="none"/>
      <rect id="selBox" fill="none" stroke="var(--accent)" vector-effect="non-scaling-stroke" stroke-width="2" rx="3" visibility="hidden" pointer-events="none"/>
    </svg>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<div class="tip" id="tip"></div>

 const step=now=>{let k=Math.min(1,(now-t0)/ms);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  setVB({x:s.x+(t.x-s.x)*k,y:s.y+(t.y-s.y)*k,w:s.w+(t.w-s.w)*k,h:s.h+(t.h-s.h)*k});if(k<1)anim=requestAnimationFrame(step);};anim=requestAnimationFrame(step);}
function toSvg(cx,cy){const r=svg.getBoundingClientRect();return{x:vb.x+(cx-r.left)/r.width*vb.w,y:vb.y+(cy-r.top)/r.height*vb.h};}
function zoomAt(px,py,f){const w=Math.min(4000,Math.max(12,vb.w*f));f=w/vb.w;setVB({x:px-(px-vb.x)*f,y:py-(py-vb.y)*f,w,h:vb.h*f});}
svg.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const p=toSvg(e.clientX,e.clientY);zoomAt(p.x,p.y,Math.exp(e.deltaY*(e.ctrlKey?.01:.0018)));},{passive:false});
const ptrs=new Map();let moved=0,pinch=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;cancelAnimationFrame(anim);
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}svg.classList.add('dragging');});
svg.addEventListener('pointermove',e=>{
 if(!ptrs.has(e.pointerId)){hover(e);return;}
 const prev=ptrs.get(e.pointerId);const r=svg.getBoundingClientRect();
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const m=toSvg((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(m.x,m.y,pinch.d/d);pinch.d=d;moved+=10;return;}
 const dx=e.clientX-prev.x,dy=e.clientY-prev.y;moved+=Math.abs(dx)+Math.abs(dy);
 setVB({...vb,x:vb.x-dx/r.width*vb.w,y:vb.y-dy/r.height*vb.h});});
function up(e){const wasTap=ptrs.size===1&&moved<5;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)svg.classList.remove('dragging');
 if(wasTap&&e.type==='pointerup'){const hit=document.elementFromPoint(e.clientX,e.clientY);const p=hit&&hit.closest&&hit.closest('.part');if(p)select(p.dataset.part);}}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('dblclick',e=>{const p=toSvg(e.clientX,e.clientY);cancelAnimationFrame(anim);zoomAt(p.x,p.y,.5);});
const tip=document.getElementById('tip'), hb=document.getElementById('hoverBox');
function box(rect,b){const pad=2;rect.setAttribute('x',b.x-pad);rect.setAttribute('y',b.y-pad);rect.setAttribute('width',b.width+pad*2);rect.setAttribute('height',b.height+pad*2);rect.setAttribute('visibility','visible');}
function hover(e){const p=e.target.closest&&e.target.closest('.part');
 if(!p||p.dataset.part==='body'&&false){tip.style.opacity=0;hb.setAttribute('visibility','hidden');return;}
 tip.textContent=PARTS[p.dataset.part].name;tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+12)+'px';tip.style.opacity=1;
 if(p.dataset.part!=='body'&&p.dataset.part!==current) box(hb,p.getBBox()); else hb.setAttribute('visibility','hidden');}
svg.addEventListener('pointerleave',()=>{tip.style.opacity=0;hb.setAttribute('visibility','hidden');});

function select(key,instant){current=key;const g=world.querySelector(`[data-part="${key}"]`);const b=g.getBBox();
 const sb=document.getElementById('selBox');box(sb,b);hb.setAttribute('visibility','hidden');
 const min=Math.max(b.width,b.height)<40?18:Math.max(b.width,b.height)*.25;
 (instant?setVB:animateTo)(boxView(b,min));renderPart(key);try{history.replaceState(null,'','#'+key);}catch(e){}document.getElementById('crumbTitle').textContent=PARTS[key].name;}
function home(){current=null;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}document.getElementById('selBox').setAttribute('visibility','hidden');animateTo(boxView(full(),20));renderOverview();document.getElementById('crumbTitle').textContent='Tagima Sixmart';}
document.getElementById('home').onclick=home;
document.getElementById('fit').onclick=()=>animateTo(boxView(full(),20));
document.getElementById('zin').onclick=()=>{const c={x:vb.x+vb.w/2,y:vb.y+vb.h/2};const t={...vb};const f=.6;animateTo({x:c.x-(c.x-t.x)*f,y:c.y-(c.y-t.y)*f,w:t.w*f,h:t.h*f},260);};
document.getElementById('zout').onclick=()=>{const c={x:vb.x+vb.w/2,y:vb.y+vb.h/2};const f=1/.6;animateTo({x:c.x-(c.x-vb.x)*f,y:c.y-(c.y-vb.y)*f,w:vb.w*f,h:vb.h*f},260);};
addEventListener('keydown',e=>{if(e.key==='Escape')home();if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;if(e.key==='+'||e.key==='=')document.getElementById('zin').click();if(e.key==='-')document.getElementById('zout').click();});
new ResizeObserver(()=>{const c={x:vb.x+vb.w/2,y:vb.y+vb.h/2};const a=aspect();let w=vb.w,h=vb.h;if(w/h<a)w=h*a;else h=w/a;
 // keep the zoom level: base on the dimension that was fitting
 setVB({x:c.x-w/2,y:c.y-h/2,w,h});}).observe(stage);

applyState();setVB(boxView(full(),20));renderOverview();
{const h=location.hash.slice(1);if(PARTS[h])select(h,true);}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PARTS[h]&&h!==current)select(h);});
</script>
