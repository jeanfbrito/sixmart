<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sixmart Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ef; --stage-a:#ecebe8; --stage-b:#d9d6d1; --panel:#ffffff; --ink:#1b1a19; --muted:#6b6660;
  --line:#e2ddd6; --accent:#d4142a; --accent-ink:#ffffff; --chip:#f2efea; --btn:#ffffffee;
  --tag-spec:#1f6f43; --tag-photo:#1d4f91; --tag-ref:#8a5a00; --tag-inf:#7a3a8f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --stage-a:#1d1d21; --stage-b:#0f0f11; --panel:#1b1b1f; --ink:#ecebe8; --muted:#9b978f;
    --line:#2e2e34; --accent:#ff4b5c; --accent-ink:#1b0306; --chip:#26262c; --btn:#26262cee;
    --tag-spec:#6fd39b; --tag-photo:#8ab8ff; --tag-ref:#f0c060; --tag-inf:#d79cf0;
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --stage-a:#1d1d21; --stage-b:#0f0f11; --panel:#1b1b1f; --ink:#ecebe8; --muted:#9b978f;
  --line:#2e2e34; --accent:#ff4b5c; --accent-ink:#1b0306; --chip:#26262c; --btn:#26262cee;
  --tag-spec:#6fd39b; --tag-photo:#8ab8ff; --tag-ref:#f0c060; --tag-inf:#d79cf0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;height:100vh}
.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--stage-a),var(--stage-b));touch-action:none;user-select:none;-webkit-user-select:none}
#guitar{width:100%;height:100%;display:block;cursor:grab}
#guitar.dragging{cursor:grabbing}
.part{cursor:pointer}
.toolbar{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.toolbar button,.crumb button{border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
.toolbar button:hover{border-color:var(--accent)}
.zoomlvl{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--muted);text-align:center;padding-top:2px}
.crumb{position:absolute;left:14px;top:14px;z-index:2;display:flex;gap:8px;align-items:center}
.crumb .title{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;backdrop-filter:blur(6px)}
.hint{position:absolute;left:14px;bottom:12px;color:var(--muted);font-size:12px;z-index:2;background:var(--btn);border:1px solid var(--line);padding:6px 10px;border-radius:8px;backdrop-filter:blur(6px)}
.tip{position:fixed;pointer-events:none;background:#111;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap}
.panel{min-width:0;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:22px 22px 40px}
.panel h1{font-size:20px;margin:0 0 2px}
.panel h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 12px}
.what{margin:8px 0 0}
table.kv{width:100%;border-collapse:collapse}
table.kv td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--muted);width:38%;padding-right:10px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:999px;margin-left:6px;border:1px solid currentColor;vertical-align:1px;opacity:.85}
.tag.spec{color:var(--tag-spec)} .tag.photo{color:var(--tag-photo)} .tag.ref{color:var(--tag-ref)} .tag.inferred{color:var(--tag-inf)}
.note{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.list{display:flex;flex-direction:column;gap:2px}
.group-label{font-size:11px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.ctl{margin:12px 0}
.ctl label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.ctl label span{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent)}
.sound{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px}
.sound b{display:block;margin-bottom:2px}
.secs{margin-top:16px}
details.sec{border-top:1px solid var(--line)}details.sec:last-child{border-bottom:1px solid var(--line)}
details.sec>summary,details.adj>summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;user-select:none;-webkit-user-select:none}
details.sec>summary::-webkit-details-marker,details.adj>summary::-webkit-details-marker{display:none}
details.sec>summary::after,details.adj>summary::after{content:'';flex:none;margin-left:auto;margin-right:3px;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.sec[open]>summary::after,details.adj[open]>summary::after{transform:rotate(45deg)}
details.sec>summary{padding:13px 2px}
details.sec>summary .t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
details.sec>summary .h{flex:1;min-width:0;text-align:right;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.sec[open]>summary .h{visibility:hidden}
details.sec>summary:hover .t,details.adj>summary:hover b{color:var(--accent)}
details.sec>summary:focus-visible,details.adj>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sec-b{padding:0 0 18px}.sec-b>.group-label:first-child{margin-top:0}
details.adj{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--chip)}
details.adj>summary{padding:10px 14px}
.adj-h{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.adj-h span{color:var(--accent);font-size:13px;font-weight:600}
.adj-b{padding:0 14px 12px}
.adj ol{margin:8px 0 0;padding-left:18px}.adj li{margin:3px 0}
svg.dg{width:100%;height:auto;display:block;border-radius:8px;background:var(--panel);font:10.5px system-ui,sans-serif;fill:var(--ink)}
.dg .wood{fill:#d9b26c}.dg .board{fill:#2a2624}.dg .guard{fill:#151517}.dg .pu{fill:#26262b;stroke:#4a4a52}.dg .metal{fill:#9aa0a6;stroke:#5b6066;stroke-width:.6}
.dg .saddle{fill:#2c2c30;stroke:#55555c}.dg .nut{fill:#efe9dc;stroke:#b5ab96}.dg .screw{fill:#3a3a40;stroke:#8e9297;stroke-width:.8}.dg .skin{fill:#e8b89a}
.dg .str{stroke:#bfc3c7;stroke-width:1.8;fill:none}.dg .spring{stroke:#8e9297;stroke-width:1.6;fill:none}.dg .cavity{fill:#111;opacity:.85}
.dg .acc{stroke:var(--accent);fill:var(--accent);stroke-width:1.6}.dg text.acc{stroke:none;font-weight:700}.dg text.dim{fill:var(--muted)}.dg line.acc{fill:none}
.order{display:grid;gap:6px}.order button b{display:block;font-weight:600}.order button span{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}.order button{text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}.order button:hover{border-color:var(--accent)}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font:inherit;margin-bottom:10px}
.foot{color:var(--muted);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
.foot a{color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.preset{border:1px solid var(--accent);border-radius:14px;padding:14px 16px;margin:14px 0 6px;background:var(--chip)}
.preset-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.preset-h b{font-size:17px}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps li{counter-increment:s;margin:6px 0}
.steps button{display:grid;grid-template-columns:22px 1fr;column-gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;cursor:pointer}
.steps button::before{content:counter(s);grid-row:1/3;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px}
.steps button b,.steps button span{grid-column:2;display:block}.steps button span{color:var(--muted);font-size:12.5px}
.steps button:hover,.steps button.on{border-color:var(--accent)}.steps button.on{box-shadow:inset 0 0 0 1px var(--accent)}
.linkbox{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:12px ui-monospace,Menlo,monospace;padding:6px 8px}
.warn{color:var(--tag-ref);border:1px solid currentColor;border-radius:8px;padding:6px 10px;font-size:12.5px;margin:8px 0}
.api pre,.api code{font:12px ui-monospace,Menlo,monospace}
.api pre{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:8px 0}
.api code{background:var(--chip);padding:1px 4px;border-radius:4px}
.api table.kv td:first-child{width:30%}.api a{color:var(--accent)}
.tuner .group-label{margin:12px 0 6px}.tuner .ctl{margin:12px 0}
.chips.dim{opacity:.5}
.savebox{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.saverow{display:flex;gap:6px;align-items:center}
.field{flex:1;min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;padding:7px 10px}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
.savebox .field.note{margin-top:6px}
.status{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:1.2em;overflow-wrap:anywhere}.status.ok{color:var(--tag-spec)}.status.err{color:var(--accent)}
.saved{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-bottom:10px}
.saved-row{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--chip)}
.saved-row .meta{flex:1;min-width:0}.saved-row .meta b,.saved-row .meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.saved-row .meta span{color:var(--muted);font-size:12px}
.mini{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}.mini[data-armed]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{color:var(--muted);font-size:13px;margin:0 0 10px}
.callout .ring{opacity:.45}.callout line{opacity:.5}.callout rect{fill-opacity:.82}.callout.active .ring{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-width:.9;opacity:.6}50%{stroke-width:2.4;opacity:1}}
.rf-num{font:600 4.4px system-ui,sans-serif;fill:var(--ink);stroke:var(--panel);stroke-width:1.2px;paint-order:stroke;text-anchor:end}
.rf-str{font:700 4.8px system-ui,sans-serif;fill:#1b1a19;stroke:#f6ecd6;stroke-width:1.2px;paint-order:stroke;text-anchor:middle}
.rf-dot circle{fill:#fff;stroke:var(--accent);stroke-width:.8}.rf-dot text{font:800 4.3px system-ui,sans-serif;fill:#1b1a19;text-anchor:middle}
.rf-dot.next circle{stroke-width:1.2;stroke-dasharray:1.5 .9}.rf-dot.next text{fill:var(--accent)}
.rf-dot.on circle{fill:var(--accent);stroke:#fff;stroke-width:.7}.rf-dot.on text{fill:var(--accent-ink)}
.rf-dot .rf-pulse{fill:none;stroke:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.riff.chordstep .rf-dot:not(.on):not(.next){opacity:.3}
.rf-path{stroke:var(--accent);stroke-width:.8;stroke-dasharray:2 1.4;fill:none;opacity:.85}
.rf-pill rect{fill:var(--accent)}.rf-pill text{font:700 4.2px system-ui,sans-serif;fill:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.rf-dot .rf-pulse,.callout.active .ring{animation:none}}
.tabwrap{margin:10px 0 4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 4px 0}
svg.tabsvg{width:100%;height:auto;display:block}
.tabsvg .tl{stroke:var(--muted);stroke-opacity:.45;stroke-width:.7}.tabsvg .tb{stroke:var(--muted);stroke-width:.9}
.tabsvg .tn{font:600 7.5px ui-monospace,Menlo,monospace;fill:var(--muted)}
.tabsvg .tf{font:700 10px ui-monospace,Menlo,monospace;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:3.4px;stroke-linejoin:round}
.tabsvg .tt{font:600 7px ui-monospace,Menlo,monospace;fill:var(--muted);text-anchor:middle}
.tabsvg .tc{font:700 7.5px system-ui,sans-serif;fill:var(--accent);text-anchor:middle}
.tabsvg .tcol{cursor:pointer}.tabsvg .thit{fill:var(--accent);fill-opacity:0}
.tabsvg .tcol:hover .thit{fill-opacity:.07}.tabsvg .tcol.on .thit{fill-opacity:.07;stroke:var(--accent);stroke-width:.9}.tabsvg .tcol.on .tf{fill:var(--accent)}
.rnow{margin:8px 0 2px}.rnow b{display:block}.rnow span{display:block;color:var(--muted);font-size:12.5px}
.rctl{margin-top:8px}
textarea.tabin{display:block;font:12px/1.35 ui-monospace,Menlo,monospace;resize:vertical;white-space:pre;overflow-x:auto}
@media (max-width:860px){
  body{overflow:auto;height:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:64vh auto;height:auto}
  .panel{border-left:0;border-top:1px solid var(--line);padding:16px 16px 40px}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="crumb"><button id="home" title="Show whole guitar" aria-label="Show whole guitar">⌂</button><div class="title" id="crumbTitle">Tagima Sixmart</div></div>
    <div class="toolbar">
      <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="fit" title="Fit" aria-label="Fit">⤢</button>
      <div class="zoomlvl" id="zlvl">100%</div>
    </div>
    <div class="hint">Scroll or pinch to zoom · drag to move · click a part</div>
    <svg id="guitar" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Tagima Sixmart guitar drawing">
      <defs>
        <radialGradient id="bodyGrad" cx="0.42" cy="0.55" r="0.7">
          <stop offset="0" stop-color="#e3222d"/><stop offset=".5" stop-color="#b10c15"/><stop offset="1" stop-color="#5c0207"/>
        </radialGradient>
        <linearGradient id="bodySheen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".45" stop-color="#fff" stop-opacity=".22"/><stop offset=".52" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <pattern id="flake" width="9" height="9" patternUnits="userSpaceOnUse">
          <circle cx="1.5" cy="2" r=".35" fill="#ffb3b3" opacity=".7"/><circle cx="6" cy="1" r=".25" fill="#fff" opacity=".6"/>
          <circle cx="4" cy="6" r=".3" fill="#ff7a7a" opacity=".6"/><circle cx="8" cy="7.5" r=".22" fill="#fff" opacity=".5"/>
          <circle cx="2.5" cy="8" r=".2" fill="#ffd0d0" opacity=".5"/>
        </pattern>
        <linearGradient id="maple" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#d7ad66"/><stop offset=".5" stop-color="#f2d59c"/><stop offset="1" stop-color="#d9b26c"/>
        </linearGradient>
        <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#121010"/><stop offset=".5" stop-color="#2a2624"/><stop offset="1" stop-color="#121010"/>
        </linearGradient>
        <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fafafa"/><stop offset=".5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#e6e8ea"/>
        </linearGradient>
        <radialGradient id="knobGrad" cx=".35" cy=".3" r=".8">
          <stop offset="0" stop-color="#4a4a4e"/><stop offset=".6" stop-color="#1a1a1c"/><stop offset="1" stop-color="#050506"/>
        </radialGradient>
        <radialGradient id="ledOn" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#ff5a6a"/><stop offset="1" stop-color="#ff2040" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="puGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a40"/><stop offset=".25" stop-color="#232327"/><stop offset="1" stop-color="#141416"/></linearGradient>
        <radialGradient id="contour"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
        <clipPath id="bodyClip"><path id="bodyClipPath"/></clipPath>
      </defs>
      <g id="world"></g>
      <g id="riffLayer" pointer-events="none"></g>
      <g id="presetLayer" pointer-events="none"></g>
      <rect id="hoverBox" fill="none" stroke="var(--accent)" stroke-opacity=".5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" stroke-width="1.5" rx="3" visibility="hidden" pointer-events="none"/>
      <rect id="selBox" fill="none" stroke="var(--accent)" vector-effect="non-scaling-stroke" stroke-width="2" rx="3" visibility="hidden" pointer-events="none"/>
    </svg>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<div class="tip" id="tip"></div>

<script>
/* ---------- geometry ---------- */
const NS='http://www.w3.org/2000/svg';
const CX=300, NUT=250, SCALE=820, NECK_END=860, W0=54, W1=72, SADDLE=1070;
const MM=SCALE/648; // units per mm (25.5" = 648 mm)
const fretY=n=>NUT+SCALE*(1-Math.pow(2,-n/12));
const halfW=y=>(W0+(W1-W0)*(y-NUT)/(NECK_END-NUT))/2;
const nutX=i=>CX+(i-2.5)*9;
const sadX=i=>CX+(i-2.5)*13.26;
const strX=(i,y)=>nutX(i)+(sadX(i)-nutX(i))*(y-NUT)/(SADDLE-NUT);
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

function applyState(){
 parts.vol.setAttribute('transform',`rotate(${ang(ST.vol)} ${VOL.x} ${VOL.y})`);
 parts.volRing.setAttribute('opacity',ST.pulled?1:0);
 parts.tone.setAttribute('transform',`rotate(${ang(ST.tone)} ${TONE.x} ${TONE.y})`);
 parts.delay.setAttribute('transform',`rotate(${ang(ST.delay)} ${DR.x} ${DR.y})`);
 parts.reverb.setAttribute('transform',`rotate(${ang(ST.reverb)} ${DR.x} ${DR.y})`);
 const a=TOGANG[ST.mode]*Math.PI/180,L=TOGLEN[ST.mode], tx=TOG.x+Math.sin(a)*L, ty=TOG.y-Math.cos(a)*L;
 parts.togLever.setAttribute('x2',tx);parts.togLever.setAttribute('y2',ty);parts.togTip.setAttribute('cx',tx);parts.togTip.setAttribute('cy',ty);
 const f=(5-ST.sel)/4; // 1=bridge end (bottom)
 const px=SEL.x+SEL.dx*SEL.len*(.5-f)*.85, py=SEL.y+SEL.dy*SEL.len*(.5-f)*.85;
 parts.selTip.setAttribute('transform',`translate(${px} ${py}) rotate(-20)`);
 parts.ledGlow.setAttribute('opacity',ST.pulled?1:0); parts.ledCore.setAttribute('fill',ST.pulled?'#ff4a5c':'#f4f4f4');
}
function soundText(){
 const pu=SELNAME[ST.sel];
 if(!ST.pulled) return `<b>Effects off · plain guitar</b>${pu} · volume ${ST.vol} · tone ${ST.tone}`;
 return `<b>Effects on · ${MODENAME[ST.mode]}</b>${pu} · volume ${ST.vol} · tone ${ST.tone}<br>Delay ${ST.delay} · reverb ${ST.reverb}`;
}

function adjHTML(keys){return keys.map(k=>{const a=ADJ[k];return `<details class="adj" data-adj="${k}"${isOpen('adj.'+k,false)?' open':''}><summary><span class="adj-h"><b>${esc(a.title)}</b><span>${esc(a.value)}</span></span></summary><div class="adj-b">${a.svg()}<ol>${a.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div></details>`;}).join('');}

/* ---------- panel ---------- */
const panel=document.getElementById('panel');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag=k=>k?`<span class="tag ${k}">${S[k]}</span>`:'';
/* collapsible sections: <details> with a one-line summary; open/closed is remembered per section id in this browser */
const OPEN=(()=>{try{return JSON.parse(localStorage.getItem('sixmart.open')||'{}')||{};}catch(e){return {};}})();
const isOpen=(id,def)=>id in OPEN?!!OPEN[id]:def;
function sec(id,title,hint,body,def=true){return `<details class="sec" data-sec="${id}"${isOpen(id,def)?' open':''}><summary><span class="t">${esc(title)}</span>${hint?`<span class="h">${esc(hint)}</span>`:''}</summary><div class="sec-b">${body}</div></details>`;}
const soundHint=()=>ST.pulled?`On · ${MODENAME[ST.mode]} · ${SELNAME[ST.sel]}`:`Effects off · ${SELNAME[ST.sel]}`;
const TUNE_HINT='E A D G B E · A = 440 Hz';
const tuningRows=()=>rows(TUNING.map(([a,b])=>[a,b,'ref']));
function openAdj(k){const d=panel.querySelector(`details.adj[data-adj="${k}"]`);if(!d)return;const s=d.closest('details.sec');if(s)s.open=true;d.open=true;requestAnimationFrame(()=>d.scrollIntoView({block:'start',behavior:'smooth'}));}
function rows(list){return `<table class="kv">${list.map(([k,v,src,n])=>`<tr><td>${esc(k)}</td><td>${esc(v)}${tag(src)}${n?`<span class="note">${esc(n)}</span>`:''}</td></tr>`).join('')}</table>`;}
const knobText=v=>`${v} · ${clock(v)}`;
function pullChips(){return `<div class="chips"><button class="chip ${ST.pulled?'':'on'}" data-pull="0">Pushed · effects off</button><button class="chip ${ST.pulled?'on':''}" data-pull="1">Pulled · effects on</button></div>`;}
function slider(id,lab,val,max=10){return `<div class="ctl"><label for="${id}">${lab}<span id="${id}V">${knobText(val)}</span></label><input type="range" id="${id}" min="0" max="${max}" step="0.5" value="${val}"></div>`;}
function ctlHTML(kind){
 if(kind==='selector') return `<div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip ${ST.sel==n?'on':''}" data-sel="${n}">${n} · ${SELNAME[n]}</button>`).join('')}</div>`;
 if(kind==='volume') return slider('cVol','Volume',ST.vol)+pullChips();
 if(kind==='mode') return `<div class="chips${ST.pulled?'':' dim'}">${['dist','clean','over'].map(m=>`<button class="chip ${ST.mode==m?'on':''}" data-mode="${m}">${m.toUpperCase()}</button>`).join('')}</div>`;
 if(kind==='tone') return slider('cTone','Tone',ST.tone);
 if(kind==='dr') return slider('cDelay','Delay (lower ring)',ST.delay)+slider('cRev','Reverb (top cap)',ST.reverb);
 return '';}
function foot(){return `<div class="foot"><div class="legend">${tag('spec')} retailer spec sheet ${tag('photo')} seen on your photos ${tag('ref')} common Strat-style setup value ${tag('inferred')} worked out, not confirmed</div><p>Specs: <a href="${SPEC_URL}" target="_blank" rel="noopener">AVL Gear listing</a>. Setup values are general references for a 25.5", 9.5"-radius guitar, not Tagima factory numbers. Measure your own guitar.</p></div>`;}

 const byG=GROUPS.map(g=>`<div class="group-label">${g}</div><div class="chips">${Object.entries(PARTS).filter(([,p])=>p.group===g).map(([k,p])=>`<button class="chip" data-go="${k}">${esc(p.name)}</button>`).join('')}</div>`).join('');
 panel.innerHTML=`<h1>Tagima Sixmart</h1><p class="sub">HSS Strat style with built-in effects · Sparkling Candy Apple</p>
 ${riffHTML()}${presetHTML()}<div class="secs">
 ${sec('ov.tuning','Tuning',TUNE_HINT,tuningRows()+`<div class="chips" style="margin-top:10px"><button class="chip" data-go="strings" data-open-adj="wind">Strings &amp; winding →</button></div>`,false)}
 ${sec('ov.riffs','Riffs',`${Object.keys(RIFFS).length} riffs · scales · chords · songs`,riffsSecHTML(),true)}
 ${sec('ov.setup','Setup','Relief · action · nut · pickups · intonation · float',`<p class="sub">Do the steps in this order. Each step opens its diagram. Values are general Strat-style references ${tag('ref')}.</p><div class="order">${SETUP_ORDER.map(([k,l,a,v])=>`<button data-go="${k}" data-open-adj="${a}"><b>${l}</b><span>${esc(v||ADJ[a].value)}</span></button>`).join('')}</div>`,false)}
 ${sec('ov.fx','Effects & sound',soundHint(),`<div class="sound" id="sound">${soundText()}</div>${tunerHTML()}${saveHTML()}`,true)}
 ${sec('ov.presets','Presets',`${SAVED.length} saved · ${Object.keys(EXAMPLES).length} examples`,savedHTML()+`<div class="group-label">Examples</div><div class="chips">${Object.entries(EXAMPLES).map(([k,e])=>`<button class="chip" data-example="${k}">${esc(e.title)}</button>`).join('')}</div>
  <p class="sub" style="margin:12px 0 6px">A link or a script can set every control and show the steps.</p><div class="chips"><button class="chip" data-api>API reference for agents →</button></div>`,true)}

 ${sec('ov.specs','Specs','Basswood · maple · 25.5" · 22 frets · HSS',rows([['Body','Basswood','spec'],['Neck','Maple, C shape','spec'],['Fretboard','Techwood, 22 frets, 9.5" radius','spec'],['Scale','25.5" (648 mm)','spec'],['Nut','43 mm','spec'],['Pickups','Humbucker + 2 single coils (HSS)','spec'],['Bridge','Tremolo','spec'],['Tuners','Diecast','spec'],['Effects','Overdrive, distortion, delay, reverb','spec'],['Outputs','6.35 mm, headphones, rec out / audio in','photo']]),false)}
 </div>${foot()}`;}
function renderPart(key){

 panel.innerHTML=`<button class="back" data-home>← Whole guitar</button>${RIFF?`<button class="back" data-home style="margin-left:14px">▲ Riff: ${esc(RIFF.title||'untitled')}</button>`:''}${PRESET?`<button class="back" data-preset-home style="margin-left:14px">▲ Preset: ${esc(PRESET.title||'untitled')}</button>`:''}<h1>${esc(p.name)}</h1><p class="sub">${p.group}</p><p class="what">${esc(p.what)}</p>
 <div class="secs">
 ${p.ctl?sec('part.setting','Setting',soundHint(),`${ctlHTML(p.ctl)}<div class="sound" id="sound">${soundText()}</div>`,true):''}
 ${p.adjust?sec('part.adjust','Adjustments',p.adjust.map(k=>ADJ[k].title).join(' · '),adjHTML(p.adjust),true):''}

const SCHEMA={

 tone:{aliases:[],values:'0–10',control:'TONE knob, same clock scale'},

};

const KEY2ST={pickup:'sel',effects:'pulled',mode:'mode',volume:'vol',tone:'tone',delay:'delay',reverb:'reverb'};
const ALIAS={};for(const [k,d] of Object.entries(SCHEMA)){ALIAS[k]=k;d.aliases.forEach(a=>ALIAS[a]=k);}
const PICKNAME={bridge:1,hb:1,humbucker:1,'bridge+middle':2,'bridge-middle':2,middle:3,mid:3,'middle+neck':4,'neck+middle':4,'neck-middle':4,'middle-neck':4,neck:5};

 'plain-clean':{title:'Plain clean',note:'Effects off: the guitar as a passive Strat.',pickup:4,effects:'off',mode:'clean',volume:10,tone:8,delay:0,reverb:0},
 'ambient-clean':{title:'Ambient clean',note:'Neck pickup with room for arpeggios.',pickup:5,effects:'on',mode:'clean',volume:8,tone:7,delay:4,reverb:7},
 'blues-drive':{title:'Blues overdrive',note:'Light crunch on the bridge humbucker.',pickup:1,effects:'on',mode:'over',volume:7,tone:6,delay:2,reverb:3},

function normalize(input){

 for(const [raw,val] of Object.entries(input||{})){
  const k=ALIAS[String(raw).toLowerCase()];
  if(!k){warn.push(`Unknown parameter "${raw}" ignored. Known: ${Object.keys(SCHEMA).join(', ')}.`);continue;}
  const str=String(val).trim(),s=str.toLowerCase();
  if(k==='title'||k==='note'){meta[k]=str.slice(0,120);continue;}
  if(k==='pickup'){const n=/^[1-5]$/.test(s)?+s:PICKNAME[s.replace(/\s+/g,'')];if(!n){warn.push(`pickup "${str}" is not 1–5 or a pickup name.`);continue;}set.sel=n;continue;}
  if(k==='effects'){if(/^(on|1|true|yes|pulled|pull|up)$/.test(s))set.pulled=true;else if(/^(off|0|false|no|pushed|push|down)$/.test(s))set.pulled=false;else warn.push(`effects "${str}" is not on or off.`);continue;}

function storeSaved(){try{localStorage.setItem(SAVEKEY,JSON.stringify(SAVED));return true;}catch(e){return false;}}
function canonical(set,meta){const c={};if(meta.title)c.title=meta.title;if(meta.note)c.note=meta.note;for(const k of ORDER){const sk=KEY2ST[k];if(sk in set)c[k]=k==='effects'?(set.pulled?'on':'off'):set[sk];}return c;}
const currentSet=()=>Object.fromEntries(ALLKEYS.map(k=>[k,ST[k]]));
function linkFor(cfg){const {set,meta}=normalize(cfg);return baseURL()+'#'+paramsFor(set,{...ST,...set},meta);}
function cfgSummary(cfg){const {set}=normalize(cfg);const b=[];if('sel' in set)b.push(SELNAME[set.sel]);

 [['vol','vol'],['tone','tone'],['delay','delay'],['reverb','reverb']].forEach(([k,l])=>{if(k in set)b.push(`${l} ${set[k]}`);});return b.join(' · ');}
function upsertSaved(list){let added=0,updated=0;for(const c of list){const t=(c.title||'').toLowerCase();const i=SAVED.findIndex(x=>(x.title||'').toLowerCase()===t);if(i>=0){SAVED[i]=c;updated++;}else if(SAVED.length<200){SAVED.push(c);added++;}}return {added,updated,stored:storeSaved()};}

 const r=upsertSaved([canonical(currentSet(),{title,note})]);
 DRAFT={name:title,note};
 if(PRESET){PRESET.title=title;PRESET.note=note;PRESET.given=[...ALLKEYS];PRESET.steps=stepsFor(currentSet(),ST);PRESET.edited=false;PRESET.active=-1;drawCallouts(PRESET.steps);
  document.getElementById('crumbTitle').textContent=title;if(!RIFF){try{history.replaceState(null,'',location.pathname+'#'+presetParams());}catch(e){}}}

 setStatus('saveStatus',r.stored?`${r.updated?'Updated':'Saved'} “${title}” in this browser. It is in Presets below.`:`Could not write to this browser's storage. “${title}” stays until you reload: use Export JSON to keep it.`,r.stored?'ok':'err');}

 const t=SAVED[i].title||'Untitled';SAVED.splice(i,1);const ok=storeSaved();rerenderOverview();setStatus('presetStatus',ok?`Deleted “${t}”.`:'Deleted for this visit only: storage is not available.',ok?'ok':'err');}

function importPresets(data){const items=Array.isArray(data)?data:(data&&Array.isArray(data.presets))?data.presets:[data];
 const good=[];let skipped=0;
 items.slice(0,200).forEach((it,i)=>{if(!it||typeof it!=='object'||Array.isArray(it)){skipped++;return;}const {set,meta}=normalize(it);if(!Object.keys(set).length){skipped++;return;}good.push(canonical(set,{title:meta.title||`Imported ${i+1}`,note:meta.note||''}));});
 return {...upsertSaved(good),skipped};}

const NOTE_RE=/^(\(?)([1-6]|[eBGDAEbgda])[\/:](x|X|\d{1,2})(\)?)((?:[hps\/\\]\d{1,2}|[br]\d{1,2}|~)*)$/;
function parseCompact(str,warn){
 const ev=[];let bar=false;
 const one=(tok,inChord)=>{
  const m=NOTE_RE.exec(tok);
  if(!m){warn.push(`"${tok}" is not a note. Write string/fret, for example 6/3.`);return [];}
  const s=/\d/.test(m[2])?+m[2]:STRLET[m[2]];
  let last=/x/i.test(m[3])?{s,f:0,mute:true}:{s,f:+m[3]};if(m[1]&&m[4])last.ghost=true;
  const chain=[last];
  for(const t of m[5].match(/[hps\/\\]\d{1,2}|[br]\d{1,2}|~/g)||[]){
   if(t==='~'){last.vib=true;continue;}
   const c=t[0],f=+t.slice(1);
   if(c==='b'){last.bend=f;continue;}if(c==='r'){last.rel=f;continue;}
   if(inChord){warn.push(`"${tok}": a hammer-on, pull-off or slide inside [ ] is ignored.`);continue;}
   last={s,f,tech:c==='h'?'h':c==='p'?'p':'s'};chain.push(last);}
  return chain;};
 for(const t of String(str).match(/\[[^\]]*\]|\||[^\s,[\]|]+/g)||[]){
  if(t==='|'){bar=true;continue;}
  if(t[0]==='['){const notes=[],parts=t.slice(1,-1).split(/[\s,]+/).filter(Boolean);let name='';
   if(parts.length>1&&/:$/.test(parts[0])&&!NOTE_RE.test(parts[0]))name=parts.shift().slice(0,-1).slice(0,12);
   for(const x of parts){const n=one(x,true)[0];if(!n)continue;
    if(notes.some(m=>m.s===n.s)){warn.push(`"${t}" has string ${n.s} two times. The second note is left out.`);continue;}notes.push(n);}
   if(notes.length){const e={notes,bar,w:1};if(name)e.name=name;ev.push(e);bar=false;}continue;}
  one(t,false).forEach((n,i)=>ev.push({notes:[n],bar:!i&&bar,w:1}));bar=false;}

// ASCII tab: blocks of tab lines; numbers that start in the same column are one chord; the column gap sets the timing of Play
function parseTab(text,warn){
 const blocks=[];let blk=null,tuning=false;
 for(const raw of String(text).replace(/\r/g,'').replace(/\t/g,'    ').split('\n')){
  const m=/^\s*([A-Ga-g][#b♯♭]?|[1-6])?\s*([|:])?([-–—0-9xX|hpbrs\/\\~().^*<> =]*)$/.exec(raw.replace(/\s+$/,''));
  if(!m||(m[3].match(/[-–—]/g)||[]).length<3){blk=null;continue;}
  if(!blk){blk=[];blocks.push(blk);}
  if(m[1]&&m[1].length>1)tuning=true;
  blk.push({label:m[1]||'',body:m[3].replace(/[–—]/g,'-')});}
 if(tuning)warn.push('A tab line names a tuning that is not standard. This page shows standard tuning (E A D G B E), with the frets as written.');
 const events=[],shown=[];
 blocks.forEach((b,bi)=>{
  if(b.length>6){warn.push(`A tab block has ${b.length} lines. A guitar has 6 strings: the page reads the first 6 lines.`);b=b.slice(0,6);}
  let map;
  if(b.length===6)map=/^[Aa]$/.test(b[1].label)&&/^[Bb]$/.test(b[4].label)?[6,5,4,3,2,1]:[1,2,3,4,5,6];
  else{map=b.map((l,i)=>{const L=l.label;if(!L)return 0;if(/^[1-6]$/.test(L))return +L;if(L[0]==='E')return b.slice(i+1).some(x=>/^[BGDAbgda]/.test(x.label))?1:6;return STRLET[L[0]]||0;});
   if(map.some(x=>!x)||new Set(map).size!==map.length){warn.push(`A tab block with ${b.length} lines is skipped. Start each line with its string name (e B G D A E), or give all six lines.`);return;}}
  const W=Math.max(...b.map(l=>l.label.length));shown.push(b.map(l=>l.label.padEnd(W)+'|'+l.body).join('\n'));
  const notes=[],last={},bars=new Set();
  b.forEach((l,li)=>{const s=map[li],t=l.body;
   for(let c=0;c<t.length;c++){const ch=t[c];
    if(ch==='|'){if(c>0&&c<t.length-1)bars.add(c);continue;}
    if(ch==='x'||ch==='X'){const n={s,f:0,mute:true,col:c,end:c};notes.push(n);last[s]=n;continue;}
    if(ch==='~'){if(last[s])last[s].vib=true;continue;}
    if(ch<'0'||ch>'9')continue;
    let j=c+1;if(j<t.length&&t[j]>='0'&&t[j]<='9'&&+t.slice(c,j+1)<=24)j++;
    const f=+t.slice(c,j),pv=c?t[c-1]:'';
    if(pv==='b'||pv==='r'){if(last[s]){if(pv==='b')last[s].bend=f;else last[s].rel=f;}}
    else{const n={s,f,col:c,end:j-1};if(pv==='h'||pv==='p')n.tech=pv;else if(pv==='/'||pv==='\\'||pv==='s')n.tech='s';if(pv==='('||t[j]===')')n.ghost=true;notes.push(n);last[s]=n;}
    c=j-1;}});
  notes.sort((p,q)=>p.col-q.col||p.s-q.s);
  const evs=[];
  for(const n of notes){const cur=evs[evs.length-1];
   if(cur&&n.col<=cur.end&&!cur.notes.some(m=>m.s===n.s)){cur.notes.push(n);cur.end=Math.max(cur.end,n.end);}else evs.push({col:n.col,end:n.end,notes:[n]});}
  const bc=[...bars];
  evs.forEach((e,i)=>{e.bar=i?bc.some(c=>c>evs[i-1].end&&c<e.col):bi>0&&events.length>0;e.w=i<evs.length-1?evs[i+1].col-e.col:0;});
  const ws=evs.slice(0,-1).map(e=>e.w).sort((p,q)=>p-q);if(evs.length)evs[evs.length-1].w=ws.length?ws[ws.length>>1]:3;
  for(const e of evs){e.notes.forEach(n=>{delete n.col;delete n.end;});delete e.col;delete e.end;events.push(e);}});
 return {events,text:shown.join('\n\n')};}
function riffNormalize(input){
 const warn=[],meta={},snd={};let riff=null,tab=null,bpm=DEFBPM;
 const src=input&&typeof input==='object'&&!Array.isArray(input)?input:{};
 for(const [raw,val] of Object.entries(src)){const key=String(raw).toLowerCase(),k=RALIAS[key];

 <div class="group-label">Notation for riff</div>
 ${rows([['6/3','String 6, fret 3. Strings go from 1 (high e, the thinnest) to 6 (low E, the thickest). Fret 0 is the open string. Frets go to 22.'],['E/3 · e/0','String letters also work: e B G D A E. Lowercase e is the high e string, uppercase E is the low E string.'],['[5/2 4/4]','Notes played together: a chord or a power chord.'],['[G: 6/3 5/2 4/0 3/0 2/0 1/3]','A chord with a name. Put a colon after the name and a space before the notes. The name shows above the tab column, beside the neck and in the step.'],['|','Bar line.'],['5/5h7 · 5/7p5','Hammer-on, pull-off.'],['5/5s7','Slide. In a tab, / and \\ also work.'],['3/7b9','Bend fret 7 up to the pitch of fret 9.'],['5/7~','Vibrato.'],['6/x','Muted string (a chug).'],['(5/7)','Ghost note: play it softly.']])}
 <p>Separate the notes with spaces or commas. In a URL, a space is <code>+</code> or <code>%20</code>.</p>
 <div class="group-label">Tab text</div>
 <p>Six lines, high e on top and low E at the bottom, as in most tabs. A block with fewer lines needs the string name at the start of each line. Play the numbers that start in the same column together. The spacing between the numbers sets the timing of Play. The page reads only the tab lines, so chord names, lyrics and other text can stay. Standard tuning only (E A D G B E). Limits: 8000 characters, 400 steps, frets 0–22.</p>
 <div class="group-label">What the player sees</div>
 <p>A dot on each fret that the riff uses, with the fret number in it. An open string has a dot above the nut. The current note is solid and pulses. The next note has a dashed ring, and a dashed line goes to it. A label beside the neck names the string and the fret, or the chord name. On a chord step, the dots of the other chords fade. The panel shows the tab and the step in words with the note name. It also has Prev, Play and Next, a speed slider, the suggested sound and a link. A click on a tab column goes to that step. The page makes no sound.</p>
 <div class="group-label">JavaScript</div>
 <pre>sixmart.riff({riff:'5/7 5/7 5/10 5/7 5/5 5/3 5/2', title:'Seven Nation Army', bpm:100})
// → {ok, title, events:[[{string, fret, note}]], steps:[...text], warnings, link}
sixmart.parseRiff({tab:'e|---…'})  // the same data, no UI change
sixmart.riffStep(3)                // go to step 3 (from 1) → {step, of, text}
sixmart.clearRiff()                // remove the riff
sixmart.riffs · sixmart.riffGroups · sixmart.riffSchema</pre>
 <p>From another window: <code>postMessage({type:'sixmart:riff', riff:{...}}, '*')</code>. The page answers with <code>{type:'sixmart:riffstate', ok, title, events, steps, warnings, link}</code>.</p>
 <div class="group-label">How to write a riff (for agents)</div>
 <ol><li>Keep it short: one riff or one exercise, not a whole song.</li>
 <li>Use standard tuning. If the song uses another tuning, move the notes to standard tuning and say so in <code>source</code>.</li>
 <li>For a beginner, use the easiest position: open strings and the first five frets when possible, and single notes before chords.</li>
 <li>Check each note. The open strings are E A D G B E from string 6 to string 1, and each fret is one semitone higher.</li>
 <li>Say how exact the notes are in <code>source</code>, for example “simplified, one string”. Do not call a riff a transcription if you did not check it against the recording.</li>
 <li>Add a suggested sound with the keys of section 2 when the riff needs drive or a clean sound.</li></ol>
 <p>The page has ${Object.keys(RIFFS).length} examples in ${RIFF_GROUPS.length} groups: ${RIFF_GROUPS.map(g=>g[0].toLowerCase()).join(', ')}. The exercises, the chord shapes and the melodies are exact: each note matches its scale, chord or melody. The song riffs are common learning versions that were not checked note for note against the recordings.</p>`)}</div>${foot()}`;

function configFromURL(){
 const q=new URLSearchParams(location.search);let h=location.hash.slice(1);if(h.startsWith('?'))h=h.slice(1);
 const hp=h.includes('=')?new URLSearchParams(h):null;
 if(![...q.keys()].length&&!hp)return null;
 const o={};for(const [k,v] of q)o[k]=v;if(hp)for(const [k,v] of hp)o[k]=v;return o;
}
window.sixmart={schema:SCHEMA,order:ORDER,examples:EXAMPLES,get:()=>stateToConfig(ST),apply:(cfg,opts)=>applyConfig(cfg,opts),
 steps:cfg=>{const {set}=normalize(cfg);return stepsFor(set,{...ST,...set}).map(s=>s.text);},
 link:cfg=>{const {set,meta}=normalize(cfg);return baseURL()+'#'+paramsFor(set,{...ST,...set},meta);},
 clear:clearPreset,
 save:cfg=>{const {set,meta,warn}=normalize(cfg);if(!Object.keys(set).length)return {ok:false,warnings:[...warn,'No control given.'],count:SAVED.length};
  const r=upsertSaved([canonical(set,{title:meta.title||`Agent preset ${SAVED.length+1}`,note:meta.note||''})]);if(panel.querySelector('[data-sec="ov.presets"]'))rerenderOverview();return {ok:true,stored:r.stored,count:SAVED.length,warnings:warn};},
 saved:()=>JSON.parse(JSON.stringify(SAVED)),
 importPresets:data=>{const r=importPresets(data);if(panel.querySelector('[data-sec="ov.presets"]'))rerenderOverview();return r;},
 exportPresets:()=>JSON.parse(exportPayload()),
 riff:(cfg,opts)=>applyRiff(cfg,opts),
 parseRiff:cfg=>{const r=riffNormalize(cfg);return {ok:r.events.length>0,title:r.title,events:eventsOut(r.events),steps:riffStepsText(r.events),warnings:r.warn,link:r.events.length?baseURL()+'#'+riffParamsOf(r):''};},
 riffStep:n=>{if(!RIFF)return null;riffStep((parseInt(n,10)||1)-1);return {step:RIFF.step+1,of:RIFF.events.length,text:stepText(RIFF.events[RIFF.step])};},
 clearRiff:()=>clearRiff(),
 riffs:RIFFS,riffGroups:RIFF_GROUPS,riffSchema:RSCHEMA};
addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object'||typeof d.type!=='string')return;
 let r=null,type='sixmart:state';if(d.type==='sixmart:apply')r=applyConfig(d.config||{});else if(d.type==='sixmart:get')r={ok:true,config:stateToConfig(ST),steps:[],warnings:[]};
 else if(d.type==='sixmart:riff'){r=applyRiff(d.riff||d.config||{});type='sixmart:riffstate';}
 if(r&&e.source){try{e.source.postMessage({type,...r},'*');}catch(err){}}});

applyState();setVB(boxView(full(),20));renderOverview();
{const h=location.hash.slice(1),cfg=configFromURL();
 if(cfg)route(cfg,{instant:true});else if(h==='api')showApi();else if(PARTS[h])select(h,true);}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);
 if(h.includes('='))route(configFromURL()||{});else if(h==='api')showApi();else if(PARTS[h]&&h!==current)select(h);});
</script>
